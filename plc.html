<style>
/* Layout: archive bulletin — header band, stat row, filter bar, card grid; detail opens as a side sheet */
:root{
  --bg:#eef6f1; --paper:#fff; --ink:#2f3e46; --ink-soft:#6c7d84; --line:#d8ebfb; --pri:#2e86de; --pri-deep:#1f5f9e; --pri-soft:#eef6ff; --mint:#3aa88f; --butter:#ffcf5a;
  --f-display:'Itim','Mali',system-ui,sans-serif; --f-body:'Mali','Itim',system-ui,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
a{color:var(--pri-deep)}
:focus-visible{outline:3px solid var(--butter);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--paper);border-bottom:3px dashed var(--line)}
header .wrap{display:flex;gap:14px;align-items:center;padding-block:12px;flex-wrap:wrap}
header img{width:52px;height:52px;border-radius:14px;box-shadow:0 0 0 3px var(--mint);transform:rotate(-4deg);background:#fff}
header h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.1}
header p{margin:2px 0 0;color:var(--ink-soft);font-size:13.5px}
header .sp{flex:1}
.btn{border:0;border-radius:14px;padding:9px 16px;font:inherit;font-weight:700;background:var(--pri);color:#fff;box-shadow:0 4px 0 var(--pri-deep);cursor:pointer;text-decoration:none;display:inline-block}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
main{padding-block:18px 40px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.stats div{background:var(--paper);border-radius:18px;padding:12px 14px;box-shadow:0 4px 0 var(--line)}
.stats b{display:block;font-family:var(--f-display);font-weight:400;font-size:32px;line-height:1.1;font-variant-numeric:tabular-nums}
.stats b.sm{font-size:17px;line-height:1.35;padding-top:6px}
.stats small{color:var(--ink-soft);font-size:12.5px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filters input,.filters select{font:inherit;border:2.5px solid var(--line);border-radius:14px;padding:9px 12px;background:#fff;max-width:100%}
.filters input{flex:1;min-width:200px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{text-align:left;font:inherit;color:inherit;border:2px solid var(--line);background:var(--paper);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:7px;box-shadow:0 4px 0 var(--line);cursor:pointer;min-width:0;transition:transform .12s}
.card:hover{transform:translateY(-2px);border-color:var(--pri)}
.card h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:20px;line-height:1.3;overflow-wrap:anywhere}
.card p{margin:0;font-size:13.5px;line-height:1.6;color:#2f3e46d9;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{font-size:11.5px;font-weight:700;background:var(--pri-soft);color:var(--pri-deep);border-radius:99px;padding:2px 9px}
.chip.live{background:var(--pri);color:#fff}
.meta{display:flex;gap:8px;font-size:12px;color:var(--ink-soft);margin-top:auto;flex-wrap:wrap}
.meta .sp{flex:1}
.empty{padding:40px 16px;text-align:center;color:var(--ink-soft);background:var(--paper);border-radius:20px}
.sheet{position:fixed;inset:0;z-index:20;background:#2f3e4659;display:flex;justify-content:flex-end}
.sheet article{background:var(--paper);width:min(640px,100%);height:100%;overflow:auto;padding:18px max(18px,env(safe-area-inset-right,0px)) 30px 22px;box-shadow:-10px 0 40px #2f3e4633}
.sheet h2{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.25;margin:10px 0}
.sheet h3{font-size:15px;color:var(--pri-deep);margin:18px 0 6px}
dl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 12px;margin:0;font-size:14px}
dt{color:var(--ink-soft)} dd{margin:0;overflow-wrap:anywhere}
.sum{white-space:pre-wrap;line-height:1.75;background:var(--pri-soft);border-radius:14px;padding:12px 14px;overflow-wrap:anywhere;margin:0}
.log{background:#f7f9fa;border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:5px;font-size:13.5px;max-height:360px;overflow:auto}
.log b{color:var(--mint)} .log small{color:var(--ink-soft);margin-left:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.note{font-size:12.5px;color:var(--ink-soft)}
.skel{height:150px;border-radius:20px;background:linear-gradient(90deg,#fff 0%,#f3f7fa 50%,#fff 100%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
@media (max-width:700px){ .stats{grid-template-columns:repeat(2,minmax(0,1fr))} dl{grid-template-columns:1fr} header h1{font-size:24px} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{ header .btn,.filters,.row{display:none!important} body{background:#fff} .card{break-inside:avoid;box-shadow:none} .sheet{position:static;background:none} .sheet article{box-shadow:none;width:100%} }
</style>
</head>

(function(){
'use strict';
const API_URL_DEFAULT = 'https://script.google.com/macros/s/AKfycbw01JxQ5pnPUD7XUwCfA2UnqgEVhYPJk0ObfENDGKc_ihkLU_boZOJ80k7lFUwgiN02/exec';
const ls = (() => { try { return window.localStorage; } catch(e){ return null; } })();
const lget = k => { try { return ls ? ls.getItem(k) : null; } catch(e){ return null; } };
const API = (() => { const q = new URLSearchParams(location.search).get('api'); if (q && /^https?:\/\//.test(q)){ try { ls.setItem('kkp_api', q); } catch(e){} return q; } return lget('kkp_api') || API_URL_DEFAULT; })();
const TOKEN = (() => { try { return JSON.parse(lget('kkp_tok') || 'null'); } catch(e){ return null; } })();
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const linkify = t => esc(t).replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)\]'"])/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
const CACHE = 'kkp_plc_page_' + API;
let DATA = null, S = {q:'', subject:'', month:''};
async function call(action, payload){
  payload = Object.assign({}, payload || {}, TOKEN ? {token:TOKEN} : {});
  const tries = [
    () => fetch(API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({action, payload})}),
    () => fetch(API + (API.includes('?') ? '&' : '?') + 'action=' + encodeURIComponent(action) + '&payload=' + encodeURIComponent(JSON.stringify(payload)))
  ];
  if (lget('kkp_via') === 'get') tries.reverse();
  let last;
  for (const t of tries){
    try { const r = await t(); const j = JSON.parse(await r.text()); if (!j.ok) throw Object.assign(new Error(j.error), {server:true}); return j.data; }
    catch(e){ if (e.server) throw e; last = e; }
  }
  throw new Error('ติดต่อเซิร์ฟเวอร์ไม่ได้ ลองรีเฟรชอีกครั้ง หรือแจ้งผู้ดูแลให้ตรวจการ Deploy');
}
const people = p => String(p.participants || '').split(',').map(x => x.trim()).filter(Boolean);
const monthKey = t => new Date(t).toISOString().slice(0, 7);
const fmtMonth = m => new Date(m + '-01').toLocaleDateString('th-TH', {month:'long', year:'numeric'});
function render(){
  const all = (DATA && DATA.list) || [];
  const ppl = new Set(); all.forEach(p => people(p).forEach(x => ppl.add(x)));
  const bySub = {}; all.forEach(p => bySub[p.subject] = (bySub[p.subject] || 0) + 1);
  const top = Object.keys(bySub).sort((a, b) => bySub[b] - bySub[a])[0] || '–';
  $('#stats').innerHTML = `<div><b>${all.length}</b><small>วง PLC ทั้งหมด</small></div><div><b>${all.filter(p => p.status === 'closed').length}</b><small>มีสรุปผลแล้ว</small></div><div><b>${ppl.size}</b><small>ครูที่ร่วมวง</small></div><div><b class="sm">${esc(top)}</b><small>กลุ่มสาระที่คุยมากที่สุด</small></div>`;
  const subs = [...new Set(all.map(p => p.subject).filter(Boolean))], months = [...new Set(all.map(p => monthKey(p.createdAt)))];
  $('#subject').innerHTML = '<option value="">ทุกกลุ่มสาระ</option>' + subs.map(x => `<option ${x===S.subject?'selected':''}>${esc(x)}</option>`).join('');
  $('#month').innerHTML = '<option value="">ทุกเดือน</option>' + months.map(m => `<option value="${m}" ${m===S.month?'selected':''}>${esc(fmtMonth(m))}</option>`).join('');
  const q = S.q.trim().toLowerCase();
  const list = all.filter(p => (!S.subject || p.subject === S.subject) && (!S.month || monthKey(p.createdAt) === S.month) && (!q || [p.title, p.detail, p.summary, p.hostName, p.participants].join(' ').toLowerCase().includes(q)));
  $('#list').innerHTML = list.length ? list.map(p => `<button type="button" class="card" data-id="${esc(p.id)}">
      <span class="chips"><span class="chip">${p.mode === 'voice' ? '🎙️ คุยด้วยเสียง' : '💬 พิมพ์สนทนา'}</span>${p.subject && p.subject !== 'ทุกกลุ่มสาระ' ? `<span class="chip">${esc(p.subject)}</span>` : ''}${p.status === 'open' ? '<span class="chip live">● กำลังคุย</span>' : ''}</span>
      <h2>${esc(p.title)}</h2><p>${esc(p.summary || (p.status === 'open' ? 'วงนี้ยังเปิดอยู่' : 'ยังไม่มีสรุปผล'))}</p>
      <span class="meta"><span>${new Date(p.createdAt).toLocaleDateString('th-TH', {day:'numeric', month:'short', year:'numeric'})} · ${esc(p.hostName)}</span><span class="sp"></span><span>👥 ${people(p).length}</span><span>💬 ${p.msgCount || 0}</span></span></button>`).join('')
    : `<div class="empty" style="grid-column:1/-1">${all.length ? 'ไม่พบวง PLC ที่ตรงกับที่ค้นหา' : 'ยังไม่มีวง PLC เมื่อครูเปิดวงในห้องพักครู สรุปจะมาแสดงที่นี่'}</div>`;
  document.querySelectorAll('.card').forEach(c => c.onclick = () => { location.hash = c.dataset.id; });
  $('#foot').textContent = DATA ? `อัปเดตล่าสุด ${new Date(DATA.updatedAt || Date.now()).toLocaleString('th-TH', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'})} น.` : '';
  openFromHash();
}
function openFromHash(){
  const id = decodeURIComponent(location.hash.slice(1));
  const p = id && DATA && (DATA.list || []).find(x => x.id === id);
  if (!p){ $('#sheet').hidden = true; return; }
  const dt = d => new Date(d).toLocaleString('th-TH', {day:'numeric', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit'});
  $('#detail').innerHTML = `<button class="btn ghost" type="button" id="close">← กลับ</button>
    <div class="chips" style="margin-top:12px"><span class="chip">${p.mode === 'voice' ? '🎙️ คุยด้วยเสียง' : '💬 พิมพ์สนทนา'}</span><span class="chip">${esc(p.subject)}</span>${p.status === 'open' ? '<span class="chip live">● กำลังคุย</span>' : ''}</div>
    <h2>${esc(p.title)}</h2>
    <dl><dt>ผู้เปิดวง</dt><dd>${esc(p.hostName)}</dd><dt>วันที่</dt><dd>${dt(p.createdAt)}</dd>${p.detail ? `<dt>ประเด็น</dt><dd>${esc(p.detail)}</dd>` : ''}
      <dt>ผู้ร่วมวง</dt><dd>${people(p).map(esc).join(', ') || '–'}</dd><dt>ข้อความในวง</dt><dd>${p.msgCount || 0} ข้อความ</dd></dl>
    <h3>สรุปผลการแลกเปลี่ยน</h3>${p.summary ? `<p class="sum">${linkify(p.summary)}</p>` : '<p class="note">ยังไม่มีสรุปผล</p>'}
    <div class="row">${TOKEN ? '<button class="btn ghost" type="button" id="logBtn">📜 ดูบันทึกการคุยทั้งหมด</button>' : '<span class="note">เข้าสู่ระบบในห้องพักครูก่อน เพื่อดูบันทึกการคุยฉบับเต็ม</span>'}<button class="btn ghost" type="button" id="copyBtn">🔗 คัดลอกลิงก์</button></div>
    <div id="logBox"></div>`;
  $('#sheet').hidden = false; $('#close').focus();
  $('#close').onclick = () => { history.replaceState(null, '', location.pathname + location.search); $('#sheet').hidden = true; };
  $('#copyBtn').onclick = async () => { try { await navigator.clipboard.writeText(location.href); $('#copyBtn').textContent = '✓ คัดลอกแล้ว'; } catch(e){ $('#copyBtn').textContent = location.href; } };
  if ($('#logBtn')) $('#logBtn').onclick = async () => {
    $('#logBox').innerHTML = '<p class="note">กำลังโหลด…</p>';
    try { const m = await call('getPlcLog', {id:p.id}); $('#logBox').innerHTML = `<h3>บันทึกการคุย</h3><div class="log">${m.length ? m.map(x => `<div><b>${esc(x.name)}</b>: ${linkify(x.text)}<small>${new Date(x.t).toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'})}</small></div>`).join('') : 'ไม่มีข้อความ'}</div>`; }
    catch(e){ $('#logBox').innerHTML = `<p class="note">${esc(e.message)}</p>`; }
  };
}
$('#q').oninput = e => { S.q = e.target.value; render(); };
$('#subject').onchange = e => { S.subject = e.target.value; render(); };
$('#month').onchange = e => { S.month = e.target.value; render(); };
$('#sheet').onclick = e => { if (e.target.id === 'sheet') $('#close').click(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet').hidden) $('#close').click(); });
window.addEventListener('hashchange', openFromHash);
$('#printBtn').onclick = () => window.print();
try { const c = JSON.parse(lget(CACHE) || 'null'); if (c){ DATA = c; render(); } } catch(e){}
if (!/^https?:\/\//.test(API)){ $('#list').innerHTML = '<div class="empty" style="grid-column:1/-1">ยังไม่ได้ตั้งค่า URL เซิร์ฟเวอร์ เปิดห้องพักครูแล้วตั้งค่าการเชื่อมต่อก่อน</div>'; return; }
call('plcArchive').then(d => { DATA = d; try { ls.setItem(CACHE, JSON.stringify(d)); } catch(e){} render(); })
  .catch(e => { if (!DATA) $('#list').innerHTML = `<div class="empty" style="grid-column:1/-1">${esc(e.message)}</div>`; else $('#foot').textContent += ' · อัปเดตไม่สำเร็จ แสดงข้อมูลที่เก็บไว้'; });
})();
</script>
</body>
</html>
